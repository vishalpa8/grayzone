# App version (semantic versioning). The single source of truth for versionName and versionCode.
#
# Release checklist:
#   1. Bump: MAJOR for breaking changes, MINOR for features, PATCH for fixes.
#   2. Add the release notes to CHANGELOG.md.
#   3. Commit and push to main. GitHub Actions (release.yml) builds, signs, tags vX.Y.Z and publishes
#      the release; phones on the GitHub build are offered it under Settings > App updates.
#
# versionCode = MAJOR * 10000 + MINOR * 100 + PATCH, so it always increases (Play Store requirement).
# MINOR and PATCH must stay within 0..99.
VERSION_MAJOR=1
VERSION_MINOR=2
VERSION_PATCH=0
