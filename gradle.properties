org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# The Kotlin compile daemon is a separate JVM and does not inherit org.gradle.jvmargs, so it
# needs its own charset pin to read the non-ASCII glyphs in our sources correctly.
kotlin.daemon.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
