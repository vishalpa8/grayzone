# Rebuilds every VPN blocklist daily from the upstream feeds, signs the manifest and publishes the
# set to the "blocklists" release. The app checks that release by itself and installs verified
# updates, so the lists stay fresh with no manual step.
#
# Needs the BLOCKLIST_SIGNING_KEY secret: a PEM P-256 private key whose public half is
# BlocklistUpdateConfig.PUBLIC_KEY in the app.
name: Blocklists

on:
  schedule:
    - cron: "17 1 * * *" # daily, 06:47 IST
  push:
    branches: [main]
    paths:
      - scripts/blocklist_tools.ps1
      - app/src/main/res/raw/critical_domains.txt
      - .github/workflows/blocklists.yml
  workflow_dispatch:

permissions:
  contents: write # publish release assets
  actions: write  # keep this scheduled workflow enabled

concurrency:
  group: blocklists
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Build lists
        shell: pwsh
        run: ./scripts/blocklist_tools.ps1 -OutputDir dist -TolerateSourceFailures

      - name: Sign manifest
        env:
          BLOCKLIST_SIGNING_KEY: ${{ secrets.BLOCKLIST_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BLOCKLIST_SIGNING_KEY}" ]; then
            echo "::error::BLOCKLIST_SIGNING_KEY secret is missing"
            exit 1
          fi
          umask 077
          key="${RUNNER_TEMP}/key.pem"
          pub="${RUNNER_TEMP}/pub.pem"
          trap 'rm -f "${key}" "${pub}"' EXIT
          # Rebuild a clean PEM whatever the paste did to it (CRLF, lost line breaks, spaces).
          body="$(printf '%s' "${BLOCKLIST_SIGNING_KEY}" | tr -d '\r' \
            | sed -e 's/-----BEGIN [A-Z ]*-----//g' -e 's/-----END [A-Z ]*-----//g' | tr -d ' \t\n')"
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "${body}" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "${key}"
          if ! openssl pkey -in "${key}" -noout 2> /dev/null; then
            echo "::error::BLOCKLIST_SIGNING_KEY is not a readable private key. Paste the whole blocklist-signing-key.pem file."
            exit 1
          fi

          # A key the app doesn't trust would make every phone reject every update; refuse to publish.
          expected="$(sed -n 's/.*"\(MFkw[A-Za-z0-9+\/=]*\)".*/\1/p' app/src/main/java/com/grayzone/app/service/vpn/update/BlocklistUpdateConfig.kt)"
          actual="$(openssl pkey -in "${key}" -pubout -outform DER | base64 -w0)"
          if [ -z "${expected}" ] || [ "${expected}" != "${actual}" ]; then
            echo "::error::BLOCKLIST_SIGNING_KEY does not match BlocklistUpdateConfig.PUBLIC_KEY in the app"
            exit 1
          fi

          openssl dgst -sha256 -sign "${key}" -out dist/blocklist_manifest.sig dist/blocklist_manifest.txt
          openssl pkey -in "${key}" -pubout -out "${pub}"
          openssl dgst -sha256 -verify "${pub}" -signature dist/blocklist_manifest.sig dist/blocklist_manifest.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' dist/blocklist_manifest.txt)"
          if ! gh release view blocklists > /dev/null 2>&1; then
            gh release create blocklists --target "${GITHUB_SHA}" --prerelease --title "Blocklists" \
              --notes "Signed VPN blocklists, rebuilt daily. The Grayzone app downloads and verifies these by itself."
          fi

          # Versioned names: a phone mid-download of the previous set is never handed a new file.
          mkdir -p upload
          while read -r kind name sha size; do
            if [ "${kind}" = "file" ]; then cp "dist/${name}" "upload/${version}-${name}"; fi
          done < dist/blocklist_manifest.txt
          gh release upload blocklists upload/* --clobber
          # Manifest last, so it only ever points at files that are already published.
          gh release upload blocklists dist/blocklist_manifest.txt dist/blocklist_manifest.sig --clobber

          # Keep the two newest sets.
          gh release view blocklists --json assets -q '.assets[].name' > assets.txt
          grep -oE '^[0-9]{12}-' assets.txt | sort -u | head -n -2 | while read -r old; do
            grep "^${old}" assets.txt | while read -r asset; do gh release delete-asset blocklists "${asset}" -y; done
          done
          echo "Published blocklist set ${version}"

      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        # GitHub disables scheduled workflows after 60 days without repository activity.
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/blocklists.yml/enable" || true
