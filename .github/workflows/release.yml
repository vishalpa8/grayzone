# Every push to main: run the tests and build both distributions.
# When version.properties names a version that has no GitHub Release yet, publish it: a signed
# APK plus update.txt, which the app's "App updates" (GitHub build) checks and installs.
#
# Needs two secrets: RELEASE_KEYSTORE_BASE64 (the .jks, base64) and RELEASE_KEYSTORE_PASSWORD.
# Without them the build and tests still run, but nothing is published.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # SHA-256 of the release signing certificate. A release signed with anything else could never
  # install over the app on phones, so publishing refuses it.
  RELEASE_CERT_SHA256: a18ff7ab9664becd1a1d6508ff1936c1a6a583bdacaa1bdc02a281b853ef9ba1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${RELEASE_KEYSTORE_BASE64}" ] || missing="${missing} RELEASE_KEYSTORE_BASE64"
          [ -n "${RELEASE_KEYSTORE_PASSWORD}" ] || missing="${missing} RELEASE_KEYSTORE_PASSWORD"
          if [ -n "${missing}" ]; then
            echo "::warning::Not publishing: repository secret(s) missing or empty:${missing} (Settings > Secrets and variables > Actions > Repository secrets)"
            exit 0
          fi
          # Pasting often adds a trailing line break or spaces; neither is ever part of the values.
          password="$(printf '%s' "${RELEASE_KEYSTORE_PASSWORD}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if ! printf '%s' "${RELEASE_KEYSTORE_BASE64}" | tr -d ' \t\r\n' | base64 -d > grayzone-release.jks 2> /dev/null; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not valid base64"
            exit 1
          fi
          printf 'storeFile=grayzone-release.jks\nstorePassword=%s\nkeyAlias=grayzone\nkeyPassword=%s\n' \
            "${password}" "${password}" > keystore.properties
          if ! keytool -list -keystore grayzone-release.jks -storepass "${password}" -alias grayzone > /dev/null 2>&1; then
            # Size and hash prefix of the encrypted keystore reveal nothing, but tell a wrong file from a wrong password.
            echo "Decoded keystore: $(stat -c %s grayzone-release.jks) bytes, sha256 $(sha256sum grayzone-release.jks | cut -c1-12); password length ${#password}"
            echo "::error::RELEASE_KEYSTORE_BASE64 / RELEASE_KEYSTORE_PASSWORD don't open the release key"
            exit 1
          fi
          echo "SIGNED=true" >> "${GITHUB_ENV}"

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testGithubDebugUnitTest assembleGithubRelease bundlePlayRelease

      - name: Keep the build
        uses: actions/upload-artifact@v5
        with:
          name: grayzone-${{ github.sha }}
          path: |
            app/build/outputs/apk/github/release/*.apk
            app/build/outputs/bundle/playRelease/*.aab
          retention-days: 30

      - name: Publish release
        if: github.ref == 'refs/heads/main' && env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prop() { sed -n "s/^$1=//p" version.properties | tr -d '\r '; }
          major="$(prop VERSION_MAJOR)"; minor="$(prop VERSION_MINOR)"; patch="$(prop VERSION_PATCH)"
          version="${major}.${minor}.${patch}"
          code=$(( major * 10000 + minor * 100 + patch ))
          tag="v${version}"

          if gh release view "${tag}" > /dev/null 2>&1; then
            echo "Release ${tag} already exists; bump version.properties to publish a new one."
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/${tag}" > /dev/null && \
             [ "$(git rev-list -n 1 "${tag}")" != "${GITHUB_SHA}" ]; then
            echo "::warning::Tag ${tag} already points at another commit; bump version.properties to publish."
            exit 0
          fi

          apk_src="app/build/outputs/apk/github/release/app-github-release.apk"
          apksigner="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)/apksigner"
          cert="$("${apksigner}" verify --print-certs "${apk_src}" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          if [ "${cert}" != "${RELEASE_CERT_SHA256}" ]; then
            echo "::error::The APK is not signed with the release key (got '${cert}')"
            exit 1
          fi

          apk="grayzone-${version}.apk"
          cp "${apk_src}" "${apk}"
          notes="$(awk -v v="${version}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md | sed '/./,$!d')"
          {
            echo "format=1"
            echo "versionCode=${code}"
            echo "versionName=${version}"
            echo "apk=${apk}"
            echo "sha256=$(sha256sum "${apk}" | cut -d' ' -f1)"
            echo "size=$(stat -c %s "${apk}")"
            echo "notes:"
            printf '%s\n' "${notes}"
          } > update.txt

          gh release create "${tag}" "${apk}" update.txt \
            --target "${GITHUB_SHA}" --title "Grayzone ${version}" \
            --notes "${notes:-Grayzone ${version}}" --latest
          echo "Published ${tag}"
